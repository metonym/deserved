# `bun fmt` and `bun lint` (Bun canary).

[fmt]
# Markdown, YAML and the demo HTML stay hand-formatted.
ignorePatterns = ["**/*.md", "**/*.yml", "**/*.yaml", "**/*.html"]

# ESLint and typescript-eslint recommended rules are on by default.
[lint]
maxWarnings = 0

[lint.rules]
# A bare `catch {}` is how this codebase ignores best-effort failures.
"no-empty" = ["warn", { allowEmptyCatch = true }]
